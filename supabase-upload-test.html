<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Supabase Upload Test</title>
  </head>
  <body>
    <h1>Supabase Upload Test</h1>
    <p>Select a file and click Upload — the test will show the public URL on success.</p>
    <input type="file" id="file-input" />
    <button id="upload-btn">Upload</button>
    <pre id="status"></pre>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js/dist/umd/supabase.js"></script>
    <script src="config.js"></script>
    <script>
      const status = document.getElementById('status');
      const input = document.getElementById('file-input');
      const btn = document.getElementById('upload-btn');

      const SUPABASE_URL = window.SUPABASE_URL || '';
      const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || '';
      const SUPABASE_BUCKET = window.SUPABASE_PHOTO_BUCKET || 'client-photos';

      if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
        status.textContent = 'Missing Supabase config in config.js';
        btn.disabled = true;
      }

      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      btn.addEventListener('click', async () => {
        const file = input.files[0];
        if (!file) {
          status.textContent = 'Choose a file first.';
          return;
        }
        btn.disabled = true;
        status.textContent = 'Uploading...';
        try {
          const ext = file.name.split('.').pop();
          const path = `test-uploads/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
          const { data, error } = await supabase.storage.from(SUPABASE_BUCKET).upload(path, file);
          if (error) throw error;
          const { publicURL, error: publicError } = supabase.storage.from(SUPABASE_BUCKET).getPublicUrl(path);
          if (publicError) throw publicError;
          status.textContent = `Upload successful. Public URL:\n${publicURL}`;
        } catch (err) {
          status.textContent = 'Upload failed: ' + (err.message || JSON.stringify(err));
          console.error(err);
        } finally {
          btn.disabled = false;
        }
      });
    </script>
  </body>
</html>
